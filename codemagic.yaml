# Codemagic — 가림 암기노트 (Capacitor 8 · SPM)

# 사전 준비 (Personal 계정 · Mac 불필요)
# 1) Integrations → Developer Portal → API 키 이름: amginote
# 2) Environment variables 그룹 `ios_signing` 에 CERTIFICATE_PRIVATE_KEY 추가
#    (로컬에서: openssl genrsa 2048  → 개인키 PEM 전체 붙여넣기)
# 3) Start build → Workflow: iOS TestFlight
#
# 문서: docs/APP_STORE_LAUNCH.md

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: amginote
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: com.clowood.amginote
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: "1099650153"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web and sync Capacitor iOS
        script: |
          npm run build
          npx cap sync ios
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
          agvtool new-marketing-version 1.4.0
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - clowood.cy@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-play-internal:
    name: Android Play Internal
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - amginote
      vars:
        PACKAGE_NAME: com.clowood.amginote
      node: 22
      java: 17
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web and sync Capacitor Android
        script: |
          npm run build
          npx cap sync android
      - name: Build release bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
